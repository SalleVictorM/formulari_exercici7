<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción a Torneo de Videojuegos</title>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>

    <div class="form-container">
        <h1>Inscripción al Torneo de Videojuegos</h1>
        
        <form>
            <div class="section-group">
                <div class="section-title">Información Personal</div>

                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required placeholder="correo@ejemplo.com">
                </div>

                <div class="form-group">
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" min="16" required placeholder="Mínimo 16 años">
                </div>

                <div class="form-group">
                    <label for="fecha_nacimiento">Fecha de nacimiento:</label>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                </div>
            </div>

            <div class="section-group">
                <div class="section-title">Perfil de Jugador</div>

                <div class="form-group">
                    <label for="nickname">Nombre del jugador (nickname):</label>
                    <input type="text" id="nickname" name="nickname" minlength="3" maxlength="15" required placeholder="Entre 3 y 15 caracteres">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña de la cuenta:</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="videojuego">Videojuego del torneo:</label>
                    <select id="videojuego" name="videojuego" required>
                        <option value="" disabled selected>-- Selecciona un videojuego --</option>
                        <option value="valorant">Valorant</option>
                        <option value="fc26">EA Sports FC 26</option>
                        <option value="league_of_legends">League of Legends</option>
                        <option value="tekken8">Tekken 8</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Plataforma (Selección única):</label>
                    <div class="radio-group">
                        <label class="radio-label"><input type="radio" name="plataforma" value="PC" required> PC</label>
                        <label class="radio-label"><input type="radio" name="plataforma" value="PlayStation"> PlayStation</label>
                        <label class="radio-label"><input type="radio" name="plataforma" value="Xbox"> Xbox</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Disponibilidad horaria (Selección múltiple):</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label"><input type="checkbox" name="disponibilidad" value="Mañana"> Mañana</label>
                        <label class="checkbox-label"><input type="checkbox" name="disponibilidad" value="Tarde"> Tarde</label>
                        <label class="checkbox-label"><input type="checkbox" name="disponibilidad" value="Noche"> Noche</label>
                    </div>
                </div>
            </div>

            <div class="section-group">
                <div class="section-title">Detalles y Aceptación</div>

                <div class="form-group">
                    <label for="comentarios">Comentarios adicionales:</label>
                    <textarea id="comentarios" name="comentarios" rows="3" placeholder="Información adicional..."></textarea>
                </div>

                <div class="form-group terms-group">
                    <input type="checkbox" id="normas" name="normas" required>
                    <label for="normas">Acepto las <a href="#normas-torneo" target="_blank">normas del torneo [ToS]</a></label>
                </div>
            </div>

            <div class="button-group">
                <button type="submit">Inscribirse</button>
                <button type="reset">Limpiar Formulario</button>
            </div>
        </form>
    </div>

</body>
</html>
